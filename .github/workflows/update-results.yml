name: Eredmények frissítése (mkosz.hu)

on:
  schedule:
    - cron: '*/30 16-22 * * *'  # esténként félóránként (kb. 18:00–24:00 magyar idő), a meccsek végére
    - cron: '15 6 * * *'        # és reggel egyszer, ha este még nem volt fent az eredmény
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-results.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
